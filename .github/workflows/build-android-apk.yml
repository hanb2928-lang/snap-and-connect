name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: 1
      EAS_NO_VCS: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify node_modules
        run: |
          test -d node_modules/expo-router || { echo "expo-router missing from node_modules"; exit 1; }
          test -d node_modules/expo || { echo "expo missing from node_modules"; exit 1; }
          echo "node_modules verification passed"

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://fzvvriycfiqecherbhli.supabase.co" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6dnZyaXljZmlxZWNoZXJiaGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NzU4MDUsImV4cCI6MjEwMzA1MTgwNX0.0eAASvxwmKsPamXPukjvnzJrz5DnDoznoDCCm2SV2Vs" >> .env

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Output build URL
        run: |
          echo "APK build started on EAS servers."
          echo "Check status at: https://expo.dev → Builds"
          echo "APK will be available for download once build completes."
