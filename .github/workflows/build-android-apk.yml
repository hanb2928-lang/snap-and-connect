name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: |
          npm install -g expo-cli

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://fzvvriycfiqecherbhli.supabase.co" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6dnZyaXljZmlxZWNoZXJiaGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NzU4MDUsImV4cCI6MjEwMzA1MTgwNX0.0eAASvxwmKsPamXPukjvnzJrz5DnDoznoDCCm2SV2Vs" >> .env

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint -x lintRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortconnect-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
